name: Build Plugin

on:
  push:
    branches: [ "XiaoJie-150/1.21" ]
  pull_request:
    branches: [ "XiaoJie-150/1.21" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout packet-events branch
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean and build with Gradle
        run: ./gradlew clean build

      - name: List plugin artifacts
        run: find ./plugin/build/libs -name "*.jar" -type f

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Adyeshach-plugin-${{ github.run_number }}
          path: plugin/build/libs/Adyeshach-*.jar
